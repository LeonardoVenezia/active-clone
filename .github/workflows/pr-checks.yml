name: PR Checks

on:
  pull_request:
    branches: ['*']

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate plugin registry
        run: pnpm discover-plugins

      # Lint solo los archivos cambiados del PR: el repo arrastra deuda de lint
      # preexistente (nunca estuvo verde). La deuda de archivos legacy tocados
      # solo para registrar pasos está documentada en biome.jsonc (overrides).
      # Archivos nuevos del PR quedan cubiertos por todas las reglas.
      - name: Run check (changed files)
        run: |
          files=$(git diff --name-only ${{ github.event.pull_request.base.sha }}...HEAD | grep -E '\.(ts|tsx|js|jsx|json|jsonc)$' || true)
          if [ -n "$files" ]; then
            pnpm exec ultracite check $files
          else
            echo "Sin archivos linteables en el diff"
          fi

      - name: Run type check
        if: success() || failure()
        run: pnpm type-check

      - name: Run build
        if: success() || failure()
        run: pnpm build
