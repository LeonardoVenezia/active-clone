name: PR Checks

on:
  pull_request:
    branches: ['*']

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate plugin registry
        run: pnpm discover-plugins

      # Lint solo los archivos cambiados del PR: el repo arrastra deuda de lint
      # preexistente (nunca estuvo verde). La deuda de archivos legacy tocados
      # solo para registrar pasos está documentada en biome.jsonc (overrides).
      # Archivos nuevos del PR quedan cubiertos por todas las reglas.
      - name: Run check (changed files)
        run: |
          # Solo archivos presentes (sin borrados), robusto a espacios y renombres, base exacta del PR.
          git diff --name-only --diff-filter=d "${{ github.event.pull_request.base.sha }}...HEAD" -- '*.ts' '*.tsx' '*.js' '*.jsx' '*.json' '*.jsonc' > /tmp/changed.txt
          if [ -s /tmp/changed.txt ]; then
            xargs -d '\n' -a /tmp/changed.txt pnpm exec ultracite check
          else
            echo "Sin archivos linteables en el diff"
          fi

      # Suites del pack ecommerce + positions (validación de este trabajo).
      # Acotadas a los directorios del pack; los tests de consola con fallas
      # preexistentes (import server-only en node) quedan fuera a propósito.
      - name: Run pack tests
        if: success() || failure()
        run: |
          dirs="tests/support tests/notices tests/stock-alerts tests/stock-compare tests/shipments tests/payments tests/workflows tests/mercadolibre"
          present=""; missing=""
          for d in $dirs; do
            if ls "$d"/*.test.ts >/dev/null 2>&1; then present="$present $d"; else missing="$missing $d"; fi
          done
          if [ -z "$present" ]; then
            echo "Sin suites de pack en esta rama; paso omitido"
            exit 0
          fi
          if [ -n "$missing" ]; then
            echo "ERROR: faltan suites esperadas del pack:$missing" >&2
            exit 1
          fi
          files=""
          for d in $present; do files="$files $d/*.test.ts"; done
          npx tsx --test $files

      - name: Run type check
        if: success() || failure()
        run: pnpm type-check

      - name: Run build
        if: success() || failure()
        run: pnpm build
